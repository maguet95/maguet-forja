# ⚒️ La forja de Maguet (PLAN-STUDIO.md §5, fase 5). Este archivo va en el repositorio PÚBLICO maguet95/maguet-forja,
# en .github/workflows/forjar.yml (FORJA-PASOS.md, paso 4). Lo lanza la API (workflow_dispatch) cuando Enmanuel aprueba
# una comunidad en Maguet HQ. El código que corre NO vive aquí: viene en el kit de esa versión del launcher, y se
# comprueba su huella contra el manifiesto ANTES de ejecutar nada.
#
# Seguridad:
#   - Las entradas (id, codigo, version) llegan como variables de entorno y se validan; nunca se pegan en el guion.
#   - Permisos mínimos del GITHUB_TOKEN (solo leer este repositorio). Subir instaladores usa SUBIR_INSTALADORES, un
#     token de grano fino limitado a launcher-archivos.
#   - El certificado de firma solo existe durante el paso de firmar (forja-robot.js lo borra al terminar).
#   - La única acción de fuera (setup-node) va fijada por su commit, no por una etiqueta que se pueda mover.
name: Forjar

on:
  workflow_dispatch:
    inputs:
      id:
        description: Id de la petición en la API
        required: true
      codigo:
        description: Código de la comunidad
        required: true
      version:
        description: Versión del launcher
        required: true

permissions:
  contents: read

concurrency:
  group: forja-${{ inputs.codigo }}
  cancel-in-progress: false

jobs:
  forjar:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ID: ${{ inputs.id }}
      CODIGO: ${{ inputs.codigo }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validar la petición
        shell: pwsh
        run: |
          if ($env:ID -notmatch '^[0-9a-f-]{36}$') { throw 'id no válido' }
          if ($env:CODIGO -notmatch '^[a-z0-9][a-z0-9-]{1,30}$') { throw 'código no válido' }
          if ($env:VERSION -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,4}(-[a-z0-9.]{1,20})?$') { throw 'versión no válida' }

      - name: Bajar el kit de esa versión y comprobar su huella
        shell: pwsh
        run: |
          $base = "https://github.com/maguet95/launcher-archivos/releases/download/forja-v$env:VERSION"
          Invoke-WebRequest -UseBasicParsing "$base/forja-$env:VERSION.json" -OutFile manifiesto.json
          $m = Get-Content manifiesto.json -Raw | ConvertFrom-Json
          if ($m.version -ne $env:VERSION) { throw 'el manifiesto es de otra versión' }
          if ($m.kit.archivo -notmatch '^kit-forja-[0-9a-z.+-]+\.zip$') { throw 'nombre de kit raro' }
          Invoke-WebRequest -UseBasicParsing "$base/$($m.kit.archivo)" -OutFile kit.zip
          $h = (Get-FileHash kit.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $m.kit.sha256) { throw "el kit no cuadra con su huella (kit.sha256): NO se ejecuta" }
          New-Item -ItemType Directory kit | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -x -f kit.zip -C kit
          if ($LASTEXITCODE -ne 0) { throw 'no se pudo descomprimir el kit' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0, fijada por su commit
        with:
          node-version: 24

      - name: Instalar las herramientas del envoltorio
        working-directory: kit/app-src
        run: npm install --no-audit --no-fund --ignore-scripts=false

      - name: Poner signtool a mano
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($st) { Add-Content $env:GITHUB_PATH $st.DirectoryName }

      - name: Forjar
        shell: pwsh
        env:
          FORJA_SECRETO_ROBOT: ${{ secrets.FORJA_SECRETO_ROBOT }}
          GH_TOKEN: ${{ secrets.SUBIR_INSTALADORES }}
          FORJA_CERT_PFX_B64: ${{ secrets.FORJA_CERT_PFX_B64 }}
          FORJA_CERT_CLAVE: ${{ secrets.FORJA_CERT_CLAVE }}
        run: node kit/tools/forja-robot.js --id "$env:ID" --codigo "$env:CODIGO" --version "$env:VERSION"
